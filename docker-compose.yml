services:
  dsp:
    build:
      context: ./dsp
      dockerfile: Dockerfile
    container_name: muse-dsp
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: muse-api
    ports:
      - "3001:3001"
    env_file:
      - ./api/.env
    environment:
      - PORT=3001
      - DSP_SERVICE_URL=http://dsp:8000
    depends_on:
      - dsp
    restart: unless-stopped

